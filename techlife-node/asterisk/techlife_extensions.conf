; TECH-Life / Wazo Asterisk integration example
; Copy into the custom dialplan include loaded by your Wazo version.
; Replace TECHLIFE_BASE_URL, TECHLIFE_INGEST_SECRET, and queue names.
;
; Audio files uploaded by TECH-Life must be copied to:
;   /var/lib/asterisk/sounds/techlife/<tenant>/<file>
; Asterisk Playback() uses the path without extension.
;
[techlife-inbound]
exten => _X.,1,NoOp(TECH-Life inbound DID ${EXTEN})
 same => n,Answer()
 same => n,Set(TECHLIFE_TENANT=${CHANNELได้})
 same => n,Set(TECHLIFE_CALL_ID=${UNIQUEID})
 same => n,Set(TECHLIFE_DID=${EXTEN})
 same => n,Set(TECHLIFE_FROM=${CALLERID(num)})
 ; Replace this lookup with the AGI/HTTP integration for your Wazo deployment.
 same => n,Goto(techlife-main-ivr,s,1)

[techlife-main-ivr]
exten => s,1,NoOp(TECH-Life IVR tenant ${TECHLIFE_TENANT})
 same => n,Set(IVR_MENU_ID=${TECHLIFE_IVR_MENU_ID})
 same => n,Set(IVR_SESSION=${UNIQUEID})
 same => n,AGI(techlife_ivr_lookup.py,${TECHLIFE_TENANT},${TECHLIFE_DID},${IVR_SESSION})
 ; AGI should set:
 ;   TECHLIFE_GREETING=techlife/<tenant>/<asset_without_extension>
 ;   TECHLIFE_PROMPT=...
 ;   TECHLIFE_TIMEOUT=5
 ;   TECHLIFE_RETRIES=3
 ;   TECHLIFE_OPTION_1=queue:queue_name / extension:1001 / submenu:id / voicemail / hangup
 same => n,Set(TECHLIFE_GREETING=${IF($["${TECHLIFE_GREETING}" = ""]?techlife/default-welcome:${TECHLIFE_GREETING})})
 same => n,Playback(${TECHLIFE_GREETING})
 same => n,Set(IVR_RETRIES=${IF($["${TECHLIFE_RETRIES}" = ""]?0:${TECHLIFE_RETRIES})})
 same => n(getdigit),Read(TECHLIFE_DTMF,${TECHLIFE_PROMPT},1,,${TECHLIFE_TIMEOUT},)
 same => n,AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},OPTION_SELECTED,${TECHLIFE_DTMF})
 same => n,GotoIf($["${TECHLIFE_DTMF}" = ""]?timeout)
 same => n,GotoIf($["${TECHLIFE_DTMF}" = "1"]?queue-sales)
 same => n,GotoIf($["${TECHLIFE_DTMF}" = "2"]?queue-support)
 same => n,GotoIf($["${TECHLIFE_DTMF}" = "3"]?agent-transfer)
 same => n,GotoIf($["${TECHLIFE_DTMF}" = "9"]?hangup)
 same => n(invalid),AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},INVALID,${TECHLIFE_DTMF})
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES}+1])
 same => n,GotoIf($[${IVR_RETRIES} >= ${TECHLIFE_RETRIES}]?hangup)
 same => n,Playback(techlife/invalid-option)
 same => n,Goto(getdigit)

 same => n(timeout),AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},TIMEOUT,)
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES}+1])
 same => n,GotoIf($[${IVR_RETRIES} >= ${TECHLIFE_RETRIES}]?hangup)
 same => n,Playback(techlife/no-input)
 same => n,Goto(getdigit)

 same => n(queue-sales),Set(TECHLIFE_QUEUE=sales)
 same => n,Goto(techlife-queue,s,1)
 same => n(queue-support),Set(TECHLIFE_QUEUE=support)
 same => n,Goto(techlife-queue,s,1)
 same => n(agent-transfer),Set(TECHLIFE_AGENT_EXT=1001)
 same => n,AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},AGENT_TRANSFER,${TECHLIFE_AGENT_EXT})
 same => n,Dial(PJSIP/${TECHLIFE_AGENT_EXT},25)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?complete:hangup)

 same => n(complete),AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},EXITED,agent_transfer)
 same => n,Hangup()
 same => n(hangup),AGI(techlife_ivr_event.py,${TECHLIFE_TENANT},${IVR_SESSION},EXITED,hangup)
 same => n,Playback(techlife/goodbye)
 same => n,Hangup()

[techlife-queue]
exten => s,1,NoOp(TECH-Life queue ${TECHLIFE_QUEUE})
 same => n,AGI(techlife_queue_event.py,${TECHLIFE_TENANT},${TECHLIFE_QUEUE},${UNIQUEID},JOINED)
 same => n,Set(CHANNEL(musicclass)=default)
 ; Asterisk announces position/wait time using periodic announcements.
 ; Enable the corresponding queue.conf settings on Wazo as well.
 same => n,Set(QPOS=${QUEUEPOSITION(${TECHLIFE_QUEUE})})
 same => n,Set(QWAIT=${QUEUEWAIT(${TECHLIFE_QUEUE})})
 same => n,AGI(techlife_queue_position.py,${TECHLIFE_TENANT},${TECHLIFE_QUEUE},${UNIQUEID},${QPOS},${QWAIT})
 same => n,Playback(techlife/queue-position)
 same => n,SayNumber(${QPOS})
 same => n,Playback(techlife/your-position)
 same => n,Queue(${TECHLIFE_QUEUE},t,,,${TECHLIFE_MAX_WAIT},)
 same => n,Set(TECHLIFE_QUEUE_RESULT=${QUEUESTATUS})
 same => n,AGI(techlife_queue_event.py,${TECHLIFE_TENANT},${TECHLIFE_QUEUE},${UNIQUEID},${TECHLIFE_QUEUE_RESULT})
 same => n,GotoIf($["${TECHLIFE_QUEUE_RESULT}" = "TIMEOUT"]?overflow)
 same => n,Hangup()

 same => n(overflow),AGI(techlife_queue_event.py,${TECHLIFE_TENANT},${TECHLIFE_QUEUE},${UNIQUEID},OVERFLOW)
 same => n,Playback(techlife/queue-overflow)
 same => n,Hangup()

; Robo voice-blast/survey entry point. The robo runtime should originate
; calls into this context and set TECHLIFE_CAMPAIGN_ID and TECHLIFE_TENANT.
[techlife-robo]
exten => s,1,NoOp(TECH-Life robo campaign ${TECHLIFE_CAMPAIGN_ID})
 same => n,Answer()
 same => n,AGI(techlife_robo_node.py,${TECHLIFE_TENANT},${TECHLIFE_CAMPAIGN_ID},${UNIQUEID})
 same => n,Hangup()
